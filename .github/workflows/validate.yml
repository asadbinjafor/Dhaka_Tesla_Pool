name: Verify product and containers
on:
  push:
    branches: ['feature/**', master, pre-release, 'release/**']
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_USER: dtp_ci
          POSTGRES_PASSWORD: ci-only-nonsecret-fixture
          POSTGRES_DB: dtp_test_schema
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://dtp_ci:ci-only-nonsecret-fixture@127.0.0.1:5432/dtp_test_schema
      DATABASE_URL: postgresql://dtp_ci:ci-only-nonsecret-fixture@127.0.0.1:5432/dtp_test_schema
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.17.0
      - run: npm install --global npm@12.0.2
      - run: npm ci && npm run install:apps
      - run: npm run build && npm run typecheck && npm run lint && npm run test:unit && npm run test:integration
      - name: Actual independent npm development commands
        run: |
          npm --prefix dhaka-tesla-pool-backend run db:migrate
          setsid npm --prefix dhaka-tesla-pool-backend run start:dev > /tmp/dtp-api-dev.log 2>&1 &
          api_task_pid=$!
          setsid npm --prefix dhaka-tesla-pool-frontend run dev > /tmp/dtp-web-dev.log 2>&1 &
          web_task_pid=$!
          trap 'kill -- -"$api_task_pid" -"$web_task_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:3001/api/v1/health/ready > /dev/null && curl --silent --fail http://127.0.0.1:3000/en/sign-in > /dev/null; then break; fi
            sleep 1
          done
          curl --fail http://127.0.0.1:3001/api/v1/health/ready
          npm run test:smoke
        # Dedicated disposable CI PostgreSQL only; the two created process groups are
        # stopped before production Compose. No user process/database is touched.
      - run: npm exec -- playwright install --with-deps chromium
      - name: Clean Compose initialization and repeat startup
        run: |
          export POSTGRES_USER=dtp_container POSTGRES_DB=dtp_compose_test
          export POSTGRES_PASSWORD="$(openssl rand -hex 24)"
          docker compose up --build --wait
          curl --fail http://127.0.0.1:3000/api/v1/health/ready
          docker compose up --wait
          curl --fail http://127.0.0.1:3000/api/v1/health/ready
          npm run test:smoke
          export DEMO_PASSWORD=Browser-test-nonsecret-2026
          docker compose --profile demo run --rm seed
          E2E_PASSWORD="$DEMO_PASSWORD" npm run test:e2e
          before=$(docker compose exec -T db psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc 'SELECT count(*) FROM ride_requests')
          test "$before" -gt 0
          docker compose down
          docker compose up --wait
          after=$(docker compose exec -T db psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc 'SELECT count(*) FROM ride_requests')
          test "$before" = "$after"
          docker compose --profile demo run --rm seed
          reseeded=$(docker compose exec -T db psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc 'SELECT count(*) FROM ride_requests')
          test "$before" = "$reseeded"
          curl --fail http://127.0.0.1:3000/api/v1/health/ready
          docker compose stop db
          unavailable=$(curl --silent --output /tmp/ready.json --write-out '%{http_code}' http://127.0.0.1:3000/api/v1/health/ready)
          test "$unavailable" = 503
          docker compose start db
          docker compose up --wait
          curl --fail http://127.0.0.1:3000/api/v1/health/ready
          docker compose down
        # Fresh runner volume only; never deletes application volumes or user records.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: browser-evidence
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
